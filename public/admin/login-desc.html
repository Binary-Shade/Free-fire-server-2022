<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client configuration · Shade Control</title><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#e8edf7;background:#0a0f1c}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:24px 18px;background:#101728;border-right:1px solid #263149}.brand{font-size:18px;font-weight:800;margin-bottom:28px}.brand span{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:9px;border-radius:9px;background:#6c5ce7}.side a{display:block;color:#aeb9ce;text-decoration:none;padding:11px 12px;border-radius:8px;margin:4px 0}.side a:hover,.side a.active{background:#1c2740;color:white}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}h1,h2,h3,p{margin-top:0}.head p,.muted{color:#8f9bb2}.toolbar{display:flex;gap:10px}.toolbar input{min-width:300px}.card{background:#111a2d;border:1px solid #27334c;border-radius:14px}.layout{display:grid;grid-template-columns:minmax(350px,42%) 1fr;gap:18px}.list{max-height:calc(100vh - 170px);overflow:auto}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px 17px;border-bottom:1px solid #202b42;cursor:pointer}.row:hover,.row.active{background:#19243b}.row:last-child{border:0}.row b{display:block;margin-bottom:4px}.row small{color:#8996ad}.badge{align-self:start;padding:4px 8px;border-radius:20px;background:#293551;color:#bdc9dc;font-size:11px}.badge.custom{background:#173f37;color:#72e5bd}.badge.off{background:#462634;color:#ff9bb7}.editor{padding:20px;position:sticky;top:20px;height:calc(100vh - 110px);display:flex;flex-direction:column}.editor-head{display:flex;justify-content:space-between;gap:12px}.switch{display:flex;gap:9px;align-items:center}textarea,input,select,button{font:inherit;color:#e8edf7;background:#0c1323;border:1px solid #34425f;border-radius:8px;padding:10px}textarea{width:100%;flex:1;resize:none;font-family:Consolas,monospace;font-size:13px;line-height:1.5;margin:14px 0}button{cursor:pointer}button.primary{background:#6c5ce7;border-color:#6c5ce7}button.danger{color:#ff9bb7}.actions{display:flex;gap:9px;align-items:center}.status{margin-left:auto;color:#9aa8c0}.status.ok{color:#72e5bd}.status.err{color:#ff829f}.empty{padding:30px;color:#8996ad;text-align:center}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.layout{grid-template-columns:1fr}.editor{position:static;height:700px}.main{padding:16px}.toolbar input{min-width:0}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span>S</span>Shade Control</div><a href="/admin/">Dashboard</a><a class="active" href="/admin/login-desc">Client configuration</a><a href="/admin/bots">Bot configuration</a><a href="/admin/characters">Characters</a></aside><main class="main"><div class="head"><div><h1>Client configuration</h1><p>Manage the structured sections returned by LoginGetDesc. Changes apply when a player next logs in.</p></div><div class="toolbar"><input id="search" placeholder="Search configuration sections"><button id="reload">Reload</button></div></div><div class="layout"><section class="card list" id="list"><div class="empty">Loading sections…</div></section><section class="card editor"><div class="editor-head"><div><h2 id="title">Select a section</h2><p class="muted" id="description">Choose a configuration section from the list.</p></div><label class="switch"><input id="enabled" type="checkbox" disabled> Enabled</label></div><textarea id="json" spellcheck="false" disabled></textarea><div class="actions"><button class="primary" id="save" disabled>Validate and save</button><button id="format" disabled>Format JSON</button><button class="danger" id="reset" disabled>Reset to default</button><span class="status" id="status"></span></div></section></div></main></div><script>
const $=id=>document.getElementById(id);let sections=[],selected=null;
function escapeHtml(value){const d=document.createElement('div');d.textContent=String(value??'');return d.innerHTML}
function setStatus(text,type=''){$('status').textContent=text;$('status').className='status '+type}
function render(){const q=$('search').value.trim().toLowerCase(),items=sections.filter(s=>!q||s.label.toLowerCase().includes(q)||s.key.toLowerCase().includes(q)||s.description.toLowerCase().includes(q));$('list').innerHTML=items.length?items.map(s=>`<div class="row ${selected&&selected.key===s.key?'active':''}" data-key="${escapeHtml(s.key)}"><div><b>${escapeHtml(s.label)}</b><small>${escapeHtml(s.key)} · ${escapeHtml(s.description)}</small></div><span class="badge ${!s.enabled?'off':s.source==='custom'?'custom':''}">${!s.enabled?'Disabled':s.source==='custom'?'Custom':'Default'}</span></div>`).join(''):'<div class="empty">No matching sections.</div>';$('list').querySelectorAll('.row').forEach(row=>row.onclick=()=>select(row.dataset.key))}
function select(key){selected=sections.find(s=>s.key===key);if(!selected)return;$('title').textContent=selected.label;$('description').textContent=selected.description;$('enabled').disabled=false;$('enabled').checked=selected.enabled;$('json').disabled=false;$('json').value=JSON.stringify(selected.data,null,2);for(const id of['save','format','reset'])$(id).disabled=false;setStatus('');render()}
async function load(keep=true){const key=keep&&selected&&selected.key,r=await fetch('/admin/api/login-desc'),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load configuration');sections=d.sections;selected=null;render();if(key&&sections.some(s=>s.key===key))select(key)}
$('search').oninput=render;$('reload').onclick=()=>load().catch(e=>setStatus(e.message,'err'));
$('format').onclick=()=>{try{$('json').value=JSON.stringify(JSON.parse($('json').value),null,2);setStatus('JSON is valid.','ok')}catch(e){setStatus(e.message,'err')}};
$('save').onclick=async()=>{if(!selected)return;let data;try{data=JSON.parse($('json').value)}catch(e){return setStatus(`Invalid JSON: ${e.message}`,'err')}setStatus('Validating…');const r=await fetch('/admin/api/login-desc/'+encodeURIComponent(selected.key),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:$('enabled').checked,data})}),d=await r.json();if(!r.ok)return setStatus(d.error||'Save failed','err');await load();setStatus('Saved. Players receive this configuration on their next login.','ok')};
$('reset').onclick=async()=>{if(!selected||!confirm(`Reset ${selected.label} to the server default?`))return;const key=selected.key,r=await fetch('/admin/api/login-desc/'+encodeURIComponent(key),{method:'DELETE'}),d=await r.json();if(!r.ok)return setStatus(d.error||'Reset failed','err');await load(false);select(key);setStatus('Default restored.','ok')};
load(false).catch(e=>setStatus(e.message,'err'));
</script></body></html>
