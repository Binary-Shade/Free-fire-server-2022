<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Control</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11141b;--line:#292f3a;--text:#f5f7fb;--muted:#929bad;--green:#32d583;--red:#ff4d5e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}header{height:68px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#090b10ee;z-index:2}a{color:#b7c1d6;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:28px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:25px;margin:0 0 7px}p{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px}.toolbar input{width:260px}.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.summary{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted)}table{width:100%;border-collapse:collapse}.identity{display:flex;align-items:center;gap:12px}.portrait{width:48px;height:48px;object-fit:contain;border-radius:9px;background:#090b10;border:1px solid var(--line)}th,td{text-align:left;padding:11px 18px;border-bottom:1px solid #20252e}th{color:#7f899b;font-size:11px;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border:0}input,button{border:1px solid var(--line);background:#0d1016;color:var(--text);border-radius:8px;padding:9px 11px;font:inherit}button{cursor:pointer;font-weight:700}.bulk{display:flex;gap:8px}.switch{position:relative;width:44px;height:24px;display:inline-block}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:20px;background:#363d4a;cursor:pointer;transition:.2s}.slider:after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:after{transform:translateX(20px)}.badge{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#32d58316;color:#65e3a5}.badge.off{background:#ff4d5e16;color:#ff7885}.status{min-height:20px;margin-top:14px;color:var(--muted)}@media(max-width:650px){.wrap{padding:18px}.head{display:block}.toolbar{margin-top:14px;display:grid}.toolbar input{width:100%}th:nth-child(3),td:nth-child(3){display:none}}
</style></head><body><header><b>Shade Control · Characters</b><nav><a href="/admin/">Dashboard</a> · <a href="/admin/bots">Bots</a></nav></header><main class="wrap"><div class="head"><div><h1>Character availability</h1><p>Disabled characters remain visible in the game but are locked and cannot be selected, upgraded, or used.</p></div><div class="toolbar"><input id="search" placeholder="Search ID, slot, or model"><div class="bulk"><button id="all">Enable all</button><button id="none">Lock shown</button></div></div></div><section class="card"><div class="summary"><span id="count">Loading…</span><span>Changes apply on the next character-list refresh</span></div><table><thead><tr><th>Character</th><th>ID</th><th>Model</th><th>Status</th><th>Available</th></tr></thead><tbody id="rows"></tbody></table></section><div class="status" id="status"></div></main><script>
const $=id=>document.getElementById(id);let characters=[];const visible=c=>{const q=$('search').value.trim().toLowerCase();return !q||String(c.id).includes(q)||String(c.slot).includes(q)||c.model.includes(q)||c.variant.includes(q)||c.name.toLowerCase().includes(q)};function draw(){const shown=characters.filter(visible),on=characters.filter(c=>c.enabled).length;$('count').textContent=`${on} available · ${characters.length-on} locked · ${shown.length} shown`;$('rows').innerHTML=shown.map(c=>`<tr><td><div class="identity"><img class="portrait" src="${c.imageUrl}" alt="${c.name}" loading="lazy"><div><b>${c.name}</b><div style="color:#929bad;font-size:12px">${c.variant==='awakened'?'Awakened variant':'Standard character'}</div></div></div></td><td>${c.id}</td><td>${c.model}</td><td><span class="badge ${c.enabled?'':'off'}">${c.enabled?'Available':'Locked'}</span></td><td><label class="switch"><input type="checkbox" ${c.enabled?'checked':''} onchange="toggle(${c.id},this.checked)"><span class="slider"></span></label></td></tr>`).join('')}async function load(){const r=await fetch('/admin/api/characters'),d=await r.json();if(!r.ok)throw Error(d.error);characters=d.characters;draw()}async function toggle(id,enabled){const r=await fetch('/admin/api/characters/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled})}),d=await r.json();if(!r.ok){$('status').textContent=d.error;await load();return}const c=characters.find(x=>x.id===id);c.enabled=d.character.enabled;$('status').textContent=`${c.name} ${enabled?'is now available':'is now locked'}.`;draw()}async function bulk(enabled){const list=characters.filter(visible).map(c=>({id:c.id,enabled}));const r=await fetch('/admin/api/characters',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({characters:list})}),d=await r.json();if(!r.ok){$('status').textContent=d.error;return}characters=d.characters;$('status').textContent='Character settings saved.';draw()}$('search').oninput=draw;$('all').onclick=()=>bulk(true);$('none').onclick=()=>bulk(false);load().catch(e=>$('status').textContent=e.message);
</script></body></html>
