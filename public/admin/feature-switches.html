<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature switches · Shade Control</title><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#e8edf7;background:#0a0f1c}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:24px 18px;background:#101728;border-right:1px solid #263149}.brand{font-size:18px;font-weight:800;margin-bottom:28px}.brand span{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:9px;border-radius:9px;background:#6c5ce7}.side a{display:block;color:#aeb9ce;text-decoration:none;padding:11px 12px;border-radius:8px;margin:4px 0}.side a:hover,.side a.active{background:#1c2740;color:white}.main{padding:28px;max-width:1300px;width:100%;margin:auto}h1,p{margin-top:0}.muted{color:#8f9bb2}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input{flex:1}.card{background:#111a2d;border:1px solid #27334c;border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:70px 1fr 110px 100px;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid #202b42}.row:last-child{border:0}.row b{display:block;margin-bottom:4px}.row small{color:#8996ad}.id{font-family:Consolas;color:#8293b4}.badge{justify-self:start;padding:4px 9px;border-radius:20px;font-size:11px;background:#26344d}.badge.working{color:#72e5bd;background:#173f37}.badge.partial{color:#ffd37a;background:#493a1d}.badge.planned{color:#ff9bb7;background:#462634}.toggle{appearance:none;width:44px;height:24px;border-radius:20px;background:#39445b;position:relative;cursor:pointer}.toggle:after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:white;border-radius:50%;transition:.18s}.toggle:checked{background:#6c5ce7}.toggle:checked:after{left:23px}.status{min-height:22px;color:#8f9bb2}.status.err{color:#ff829f}input{font:inherit;color:#e8edf7;background:#0c1323;border:1px solid #34425f;border-radius:8px;padding:10px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.row{grid-template-columns:48px 1fr 80px}.row .badge{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span>S</span>Shade Control</div><a href="/admin/">Dashboard</a><a class="active" href="/admin/feature-switches">Feature switches</a><a href="/admin/login-desc">Client configuration</a><a href="/admin/bots">Bot configuration</a><a href="/admin/characters">Characters</a></aside><main class="main"><h1>Feature switches</h1><p class="muted">Control client entrances backed by the server. Planned features stay locked until their protocol flow is complete.</p><div class="toolbar"><input id="search" placeholder="Search switches"><span class="status" id="status"></span></div><section class="card" id="list"></section></main></div><script>
const $=id=>document.getElementById(id);let items=[];function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}function status(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' err':'')}function render(){const q=$('search').value.toLowerCase().trim(),shown=items.filter(x=>!q||x.label.toLowerCase().includes(q)||x.key.includes(q));$('list').innerHTML=shown.map(x=>`<div class="row"><span class="id">#${x.id}</span><div><b>${esc(x.label)}</b><small>${esc(x.description)}</small></div><span class="badge ${x.state}">${x.state}</span><input class="toggle" type="checkbox" data-key="${esc(x.key)}" ${x.enabled?'checked':''} ${x.state==='planned'?'disabled':''}></div>`).join('')||'<div class="row">No matching switches.</div>';$('list').querySelectorAll('.toggle').forEach(el=>el.onchange=()=>save(el))}async function load(){const r=await fetch('/admin/api/feature-switches'),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load switches');items=d.switches;render()}async function save(el){status('Saving…');const r=await fetch('/admin/api/feature-switches/'+encodeURIComponent(el.dataset.key),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:el.checked})}),d=await r.json();if(!r.ok){el.checked=!el.checked;return status(d.error||'Save failed',true)}const i=items.findIndex(x=>x.key===d.switch.key);items[i]=d.switch;status('Saved. The change applies on the next login.')}$('search').oninput=render;load().catch(e=>status(e.message,true));
</script></body></html>
