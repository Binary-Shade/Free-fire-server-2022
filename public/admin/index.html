<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Server Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --bg-secondary:#141416;
    --bg-elevated:#1C1C1F;
    --red:#FF1A1A;
    --red-hover:#E11212;
    --red-soft:#FF1A1A14;
    --text:#F5F5F5;
    --text-secondary:#A1A1AA;
    --text-muted:#71717A;
    --border:#29292E;
    --radius:8px;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans', system-ui, sans-serif;
    font-size:15px;
    line-height:1.55;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .shell{max-width:760px;margin:0 auto;padding:56px 24px 80px}

  header{margin-bottom:36px}
  .eyebrow{color:var(--text-muted);font-size:13px;margin:0 0 6px}
  h1{margin:0 0 6px;font-size:26px;font-weight:700;letter-spacing:-0.01em}
  .sub{color:var(--text-secondary);font-size:14px;margin:0;max-width:52ch}

  section{border-top:1px solid var(--border);padding:28px 0}
  section:first-of-type{border-top:1px solid var(--border)}
  .section-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin:0 0 18px}

  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:7px}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  input[type="text"], input[type="url"], input:not([type]), textarea{
    width:100%;
    background:var(--bg-secondary);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    padding:10px 12px;
    font:inherit;
    font-size:14px;
    transition:border-color 160ms ease, background 160ms ease;
  }
  textarea{min-height:92px;resize:vertical;font-family:inherit;line-height:1.5}
  input::placeholder, textarea::placeholder{color:var(--text-muted)}
  input:hover, textarea:hover{border-color:#3a3a40}
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--red);
    background:var(--bg-elevated);
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2px solid var(--red);
    outline-offset:2px;
  }

  .hint{color:var(--text-muted);font-size:12.5px;margin-top:6px}

  .upload-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .file-btn{
    position:relative;
    overflow:hidden;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-size:13.5px;
    cursor:pointer;
    transition:border-color 160ms ease, background 160ms ease;
  }
  .file-btn:hover{border-color:#3a3a40}
  .file-btn input[type="file"]{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;
  }

  .preview-wrap{margin-top:14px}
  .preview{
    max-width:220px;
    max-height:140px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    display:block;
  }

  .actions{
    display:flex;
    align-items:center;
    gap:16px;
    padding-top:28px;
    margin-top:4px;
    border-top:1px solid var(--border);
  }
  button#save{
    background:var(--red);
    color:#fff;
    border:0;
    border-radius:var(--radius);
    padding:11px 20px;
    font:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background 160ms ease;
  }
  button#save:hover{background:var(--red-hover)}
  button#save:active{background:var(--red-hover)}
  button#save:disabled{background:var(--bg-elevated);color:var(--text-muted);cursor:default}

  .status{font-size:13.5px;color:var(--text-secondary);min-height:18px}
  .status.ok{color:var(--text)}
  .status.err{color:var(--red)}

  @media (max-width: 520px){
    .shell{padding:40px 18px 64px}
    .two-col{grid-template-columns:1fr}
    h1{font-size:22px}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <p class="eyebrow">Private server</p>
    <h1>Lobby content</h1>
    <p class="sub">Changes save here and appear once the game refreshes its lobby content.</p>
  </header>

  <section>
    <p class="section-title">Server</p>
    <div class="two-col">
      <div class="field">
        <label for="region">Region</label>
        <input id="region" type="text" placeholder="e.g. eu-west">
      </div>
      <div class="field">
        <label for="language">Language</label>
        <input id="language" type="text" placeholder="e.g. en">
      </div>
    </div>
  </section>

  <section>
    <p class="section-title">Marquee</p>
    <div class="field">
      <label for="marquee">Messages</label>
      <textarea id="marquee" placeholder="One message per line"></textarea>
      <p class="hint">Each line scrolls as a separate marquee message.</p>
    </div>
  </section>

  <section>
    <p class="section-title">Banner</p>
    <div class="two-col">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text">
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text">
      </div>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description"></textarea>
    </div>
    <div class="field">
      <label for="linkUrl">Click URL</label>
      <input id="linkUrl" type="url" placeholder="https://">
    </div>
    <div class="field">
      <label for="imageUrl">Image URL</label>
      <input id="imageUrl" type="url" placeholder="https://">
    </div>
    <div class="field">
      <label>Upload image</label>
      <div class="upload-row">
        <span class="file-btn">
          Choose image
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
        </span>
        <span class="hint" id="uploadHint">PNG, JPEG or WebP. Uploads to Cloudinary.</span>
      </div>
      <div class="preview-wrap">
        <img id="preview" class="preview" hidden>
      </div>
    </div>
  </section>

  <div class="actions">
    <button id="save">Save lobby content</button>
    <p id="status" class="status" role="status"></p>
  </div>
</div>

<script>
  const $=id=>document.getElementById(id);
  let content;
  const statusEl=$('status');
  function status(t, tone){
    statusEl.textContent=t;
    statusEl.classList.remove('ok','err');
    if(tone) statusEl.classList.add(tone);
  }
  function fill(c){
    content=c;
    $('region').value=c.region;
    $('language').value=c.language;
    $('marquee').value=c.marquee.join('\n');
    for(const k of ['name','title','description','linkUrl','imageUrl']) $(k).value=c.banner[k]||'';
    preview();
  }
  function preview(){
    const u=$('imageUrl').value;
    if(u){ $('preview').src=u; $('preview').hidden=false; } else { $('preview').hidden=true; }
  }
  async function load(){
    const r=await fetch('api/content');
    const d=await r.json();
    if(!r.ok) return status(d.error, 'err');
    fill(d);
  }
  $('file').onchange=async e=>{
    const f=e.target.files[0];
    if(!f) return;
    status('Uploading image…');
    const dataUrl=await new Promise((ok,no)=>{
      const r=new FileReader;
      r.onload=()=>ok(r.result);
      r.onerror=no;
      r.readAsDataURL(f);
    });
    const r=await fetch('api/cloudinary-upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dataUrl})});
    const d=await r.json();
    if(!r.ok) return status(d.error, 'err');
    $('imageUrl').value=d.imageUrl;
    preview();
    status('Uploaded to Cloudinary. Save to publish.', 'ok');
  };
  $('imageUrl').oninput=preview;
  $('save').onclick=async()=>{
    const body={
      region:$('region').value,
      language:$('language').value,
      marquee:$('marquee').value.split('\n'),
      banner:{...content.banner, name:$('name').value, title:$('title').value, description:$('description').value, linkUrl:$('linkUrl').value, imageUrl:$('imageUrl').value}
    };
    const r=await fetch('api/content',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) return status(d.error, 'err');
    fill(d.content);
    status('Saved. Return to the game title screen and sign in again.', 'ok');
  };
  load();
</script>
</body>
</html>
